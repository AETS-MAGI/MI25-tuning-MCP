[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi25-tuning-mcp"
version = "0.1.0"
description = "MCP server for MI25/gfx900 Rust client tuning and maintenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12.0",
]

[project.scripts]
mi25-tuning-mcp = "mi25_tuning_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
